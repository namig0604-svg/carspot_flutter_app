name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Собрать flutter build web и опубликовать на GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Установить Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Установить зависимости
        run: flutter pub get

      - name: Собрать веб-версию
        run: flutter build web --release --base-href /carspot_flutter_app/

      - name: Настроить Pages
        uses: actions/configure-pages@v5

      - name: Загрузить артефакт сборки
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Опубликовать на GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
