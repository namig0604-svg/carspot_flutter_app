name: carspot
description: "CarSpot - автомобильные сходки"
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.1.0
  http_parser: ^4.1.2
  provider: ^6.1.0
  shared_preferences: ^2.2.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  url_launcher: ^6.3.0
  image_picker: ^1.1.2
  geolocator: ^13.0.1
  audioplayers: ^6.1.0
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.6
  in_app_purchase: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/backgrounds/